<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VUEKUMI Command Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./admin-v2.css">
  </head>
  <body>
    <div class="vk-admin-shell">
      <aside class="vk-admin-sidebar" aria-label="VUEKUMI command navigation">
        <a class="vk-admin-brand" href="./admin-v2.html">
          <strong>VUEKUMI</strong>
          <span>Command Center</span>
        </a>
        <nav class="vk-admin-nav">
          <button type="button" data-view="dashboard">Dashboard</button>
          <button type="button" data-view="access">Access</button>
          <button type="button" data-view="users">Users</button>
          <button type="button" data-view="contributors">Contributors</button>
          <button type="button" data-view="content">Content</button>
          <button type="button" data-view="commerce">Commerce</button>
          <button type="button" data-view="integrations">Integrations</button>
          <button type="button" data-view="activity">Activity</button>
        </nav>
        <div class="vk-admin-mini-mosaic" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </aside>

      <main class="vk-admin-main">
        <header class="vk-admin-topbar">
          <div>
            <span id="vkAdminKicker">New Admin Backend</span>
            <h1 id="vkAdminTitle">Platform Command</h1>
          </div>
          <div class="vk-admin-actions">
            <a href="./index.html">Public Site</a>
            <a href="./admin.html">Legacy Admin</a>
            <button type="button" data-action="refresh">Refresh</button>
            <button type="button" data-action="logout">Sign Out</button>
          </div>
        </header>

        <section id="vkAdminApp" class="vk-admin-app" aria-live="polite">
          <div class="vk-empty">Loading VUEKUMI command center...</div>
        </section>
      </main>
    </div>

    <div id="vkAdminToast" class="vk-admin-toast" role="status"></div>
    <script defer src="./admin-v2.js"></script>
  </body>
</html>
